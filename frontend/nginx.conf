server {
    listen 80;
    root /usr/share/nginx/html;

    # rotas do React (ex: /paises) caem no index.html
    location / {
        try_files $uri /index.html;
    }

    # pedidos da API vão pro backend, pela rede do Docker
    location /api/ {
        proxy_pass http://backend:3000/;
    }

    # diz qual front respondeu (o nome vem do docker-compose)
    location = /servidor {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "${SERVIDOR}";
    }
}
