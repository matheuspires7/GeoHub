server {
    listen 80;
    root /usr/share/nginx/html;

    # rotas do React (ex: /paises) caem no index.html
    location / {
        try_files $uri /index.html;
    }

    # a página em si: sem cache e com o nome do front escrito no HTML
    location = /index.html {
        add_header Cache-Control "no-store";
        sub_filter '</head>' '<meta name="servidor" content="${SERVIDOR}"></head>';
        sub_filter_once on;
    }

    # pedidos da API vão pro backend, pela rede do Docker
    location /api/ {
        proxy_pass http://backend:3000/;
    }

    # diz qual front respondeu (bom pra testar com curl)
    location = /servidor {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "${SERVIDOR}";
    }
}
